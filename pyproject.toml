[project]
name = "coarse"
version = "0.1.0"
description = "COARSE — block-level score-based causal discovery from soft interventions."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Gaetano Tedesco", email = "gt@4bc.dk" },
]
keywords = ["causal-discovery", "interventional-data", "partition", "dag", "bic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "dcor>=0.6",
    "networkx>=3.4.2",
    "numpy>=2.0",
    "scipy>=1.15.1",
]

[project.urls]
Repository = "https://github.com/tedescoG/coarse"
Issues = "https://github.com/tedescoG/coarse/issues"

[tool.uv]
cache-dir = "./.uv_cache"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coarse"]

[dependency-groups]
# Minimal set to run the test suite (`uv sync --group test`).
# sempler + scikit-learn are used only by one end-to-end test
# (test_intervention_sempler), not by the coarse package itself.
test = [
    "pytest>=8.3.4",
    "sempler>=0.2.14",
    "scikit-learn>=1.6.1",
]
# Everything needed to reproduce the Snakemake experiments (`uv sync --group expt`).
expt = [
    "causalchamber>=0.2.8",
    "gnies>=0.3.3",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "seaborn>=0.13.2",
    "sempler>=0.2.14",
    "snakefmt>=0.11.1",
    "snakemake>=9.10.1",
]
# Default group for maintainers — installs both of the above.
dev = [
    { include-group = "test" },
    { include-group = "expt" },
]
